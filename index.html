<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evantine Audio Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>EVANTINE</h1>
        <p>Audio Converter</p>
    </header>

    <main>

        <section class="converter">

            <h2>Convert your audio</h2>
            <p>Select an audio file and choose your format.</p>

            <input
                type="file"
                id="fileInput"
                accept="audio/*"
            >

            <label for="fileInput" class="choose-button">
                Choose Audio File
            </label>

            <p id="fileName"></p>

            <div class="settings">

                <label for="format">Output Format</label>

                <select id="format">
                    <option value="mp3">MP3</option>
                    <option value="wav">WAV</option>
                    <option value="ogg">OGG</option>
                    <option value="flac">FLAC</option>
                </select>

                <button id="convertButton">
                    Convert Audio
                </button>

            </div>

            <div id="status"></div>

            <div id="downloadArea"></div>

        </section>

    </main>

    <footer>
        <p>© 2026 Evantine</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd/ffmpeg.js"></script>
    <script src="script.js"></script>

</body>
</html>
