name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check required homepage files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          grep -q 'id="fileInput"' index.html
          grep -q 'id="convertButton"' index.html
          grep -q 'wasm-media-encoders@0.7.0' script.js
          grep -q 'MAX_FILE_SIZE' script.js
