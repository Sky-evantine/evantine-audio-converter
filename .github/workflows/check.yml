name: Converter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check Python backend syntax
        run: python3 -m py_compile server/main.py

      - name: Check required files
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          test -f server/main.py
          test -f server/Dockerfile
          test -f server/requirements.txt
          test -f render.yaml

      - name: Check converter and backend hooks
        run: |
          grep -q 'createMp3Encoder' script.js
          grep -q 'audioBufferToWav' script.js
          grep -q 'decodeAudio' script.js
          grep -q 'inputExtension' script.js
          grep -q 'yt_dlp' server/main.py
          grep -q '/health' server/main.py

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real browser conversion test
        run: node tests/browser-smoke.mjs
