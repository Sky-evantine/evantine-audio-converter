<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Evantine collection — live products from Shopify."><title>Collection — Evantine Apparel</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip-link" href="#main">Skip to content</a><div class="announcement">EVANTINE APPAREL / COLLECTION <span>NEW YORK — WORLDWIDE</span></div>
<header class="site-header"><a class="wordmark" href="/" aria-label="Evantine Apparel home">EVANTINE</a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button><nav id="site-nav" class="site-nav" aria-label="Primary"><a href="shop.html">Shop</a><a href="collections.html">Collections</a><a href="journal.html">Journal</a><a href="about.html">Story</a><button class="bag-button" type="button" aria-controls="bagPanel" aria-expanded="false">Bag <span id="bagCount">0</span></button></nav></header>
<main id="main" class="section collection-page"><div class="section-head"><div><p class="eyebrow" id="collectionEyebrow">EVANTINE</p><h1 id="collectionTitle">Collection</h1></div><p id="collectionCount">LOADING</p></div><p class="shop-intro" id="collectionDescription">Loading live products from Shopify…</p><div id="collectionNotice" class="collection-notice" hidden></div><div class="shop-toolbar"><div class="filter-group" role="group" aria-label="Filter collection"><button class="filter active" type="button" data-filter="all" aria-pressed="true">All</button><button class="filter" type="button" data-filter="apparel" aria-pressed="false">Apparel</button><button class="filter" type="button" data-filter="objects" aria-pressed="false">Objects</button></div><p id="resultCount" aria-live="polite">0 pieces</p></div><div class="product-grid product-grid-wide" id="productGrid"></div></main>
<footer class="site-footer"><span>© 2026 EVANTINE</span><span>NEW YORK / WORLDWIDE</span></footer>
<aside id="bagPanel" class="bag-panel" aria-hidden="true" aria-labelledby="bagTitle"><div class="bag-head"><div><p class="eyebrow">YOUR SELECTION</p><h2 id="bagTitle">Bag</h2></div><button id="bagClose" class="close-button" type="button" aria-label="Close shopping bag">×</button></div><div id="bagItems" class="bag-items"></div><div class="bag-foot"><div><span>Subtotal</span><strong id="bagTotal">$0</strong></div><button class="button button-dark checkout-button" type="button">Checkout</button></div></aside>
<div id="overlay" class="overlay" hidden></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="script.js"></script>
<script>
const COLLECTION_FALLBACK="https://cdn.shopify.com/s/files/1/0810/8507/1396/collections/evantine-collection-001-editorial.png?v=1789917110";
const STORE="https://1bmwgi-pw.myshopify.com",handle=new URLSearchParams(location.search).get("handle")||"collection-001",num=(handle.match(/(001|002|003)$/)||[])[1]||"001",name="Collection "+num,$id=id=>document.getElementById(id);
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function typeFor(p){return /cap|tote|bag|object|accessor|poster|tag|scarf/i.test((p.product_type||"")+" "+(p.title||""))?"objects":"apparel"}
function money(n){return "$"+Number(n||0).toFixed(2).replace(".00","")}
let items=[];
function render(){
const f=document.querySelector(".filter.active")?.dataset.filter||"all";
const filtered=items.filter(p=>f==="all"||typeFor(p)===f);
$id("resultCount").textContent=filtered.length+" piece"+(filtered.length===1?"":"s");
$id("productGrid").innerHTML=filtered.map((p,i)=>{const v=p.variants?.[0]||{},img=p.images?.[0]?.src||COLLECTION_FALLBACK,type=typeFor(p),no=String(i+1).padStart(2,"0");return '<article class="product-card"><a class="product-link" href="product.html?handle='+encodeURIComponent(p.handle)+'"><span class="product-image"><span class="product-no">'+no+'</span><span class="product-type">'+type+'</span>'+(img?'<img src="'+esc(img)+'" alt="'+esc(p.title)+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">':'<span class="garment" aria-hidden="true"></span>')+'<span class="product-view">View piece ↗</span></span><span class="product-name">'+esc(p.title)+'</span><span class="product-meta">'+esc(type)+" · "+money(v.price)+'</span></a></article>'}).join("");
if(filtered.length)return;
const fallback={
"001":[["EVANTINE TEE 001","apparel","Heavyweight cotton · $48"],["STUDIO HOODIE 001","apparel","Brushed fleece · $96"],["EVERYDAY CAP 001","objects","Cotton twill · $38"],["EVANTINE TOTE 001","objects","Heavy canvas · $42"]],
"002":[["MOTION SHELL 002","apparel","Technical nylon · Design preview"],["CITY TRACK PANT 002","apparel","Relaxed woven · Design preview"],["BOARD DAY BAG 002","objects","Utility canvas · Design preview"],["MOTION CAP 002","objects","Structured cotton · Design preview"],["EV / MOTION GRAPHIC TEE 002","apparel","Heavyweight cotton · Design preview"],["STREET LAYER 002","apparel","Midweight jersey · Design preview"]],
"003":[["AFTERLIGHT KNIT 003","apparel","Soft knit · Design preview"],["NIGHT SHIFT JACKET 003","apparel","Brushed twill · Design preview"],["REFLECTIVE TOTE 003","objects","Heavy canvas · Design preview"],["LATE HOUR SCARF 003","objects","Woven cotton · Design preview"],["AFTERLIGHT GRAPHIC TEE 003","apparel","Heavyweight cotton · Design preview"],["STUDIO OBJECT 003","objects","Mixed material · Design preview"]]
};
const set=fallback[num]||fallback["001"];
$id("resultCount").textContent=set.length+" design"+(set.length===1?"":"s");
$id("productGrid").innerHTML=set.map((x,i)=>'<article class="product-card"><div class="product-image"><span class="product-no">'+String(i+1).padStart(2,"0")+'</span><span class="product-type">'+x[1]+'</span><span class="product-index">EV / '+num+String(i+1).padStart(2,"0")+'</span><span class="garment" aria-hidden="true"></span></div><span class="product-name">'+x[0]+'</span><span class="product-meta">'+x[2]+'</span></article>').join("");
}
async function load(){try{$id("collectionEyebrow").textContent="EVANTINE / "+num;$id("collectionTitle").textContent=name;$id("collectionDescription").textContent="Live Shopify catalog · 10-piece target.";const r=await fetch(STORE+"/collections/"+encodeURIComponent(handle)+"/products.json?limit=50",{headers:{Accept:"application/json"}});if(!r.ok)throw Error("Collection unavailable");const d=await r.json();items=Array.isArray(d.products)?d.products:[];$id("collectionCount").textContent=String(items.length).padStart(2,"0")+" / 10 PIECES";const missing=10-items.length;if(missing>0){$id("collectionNotice").hidden=false;$id("collectionNotice").textContent=missing+" more piece"+(missing===1?"":"s")+" needed to complete "+name+"."}else{$id("collectionNotice").hidden=true}render()}catch(e){$id("collectionCount").textContent="SHOPIFY ERROR";$id("collectionDescription").textContent="We couldn't load this collection from Shopify right now.";render([]);console.warn(e)}}
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(x=>{x.classList.remove("active");x.setAttribute("aria-pressed","false")});b.classList.add("active");b.setAttribute("aria-pressed","true");render()}));load();
</script></body></html>
